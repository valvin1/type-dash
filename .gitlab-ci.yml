stages:
  - test
  - build
  - release

variables:
  DOCKER_TLS_CERTDIR: "/certs"

# Stage 1: Run tests (Syntax check in Node 24)
test:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test

# Stage 2: Build Docker image & push to GitLab Container Registry using buildah
build-docker:
  stage: build
  image: quay.io/buildah/stable:v1.35
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Building and pushing latest + SHA tag to registry..."
        buildah bud -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
        buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        buildah push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Building and pushing branch tag ($CI_COMMIT_REF_SLUG) to registry..."
        buildah bud -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
        buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH

# Stage 3: Automated Semantic Versioning and GitLab Release (Only on main pushes/merges)
release:
  stage: release
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apk add --no-cache git
    - npm ci --cache .npm --prefer-offline
  script:
    - npx semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
