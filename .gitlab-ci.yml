stages:
  - test
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"

# Stage 1: Run tests (Syntax check in Node 24)
test:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test

# Stage 2: Build Docker image & push to GitLab Container Registry
build-docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Building and pushing latest + SHA tag to registry..."
        docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Building and pushing branch tag ($CI_COMMIT_REF_SLUG) to registry..."
        docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
