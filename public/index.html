<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeDash - Battle de Dactylo en Temps Réel</title>
    <meta name="description" content="Affrontez vos amis dans un duel de dactylographie intense. Qui sera le plus rapide ?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">Type<span>Dash</span></h1>
            <div id="room-info" class="hidden">
                <span id="room-id-display">Salon: <span>-</span></span>
                <button id="copy-link" class="btn-secondary">Copier le lien</button>
            </div>
        </header>

        <main>
            <!-- Lobby Screen -->
            <section id="lobby" class="screen">
                <div class="glass-card">
                    <h2>Prêt pour le duel ?</h2>
                    <p>Créez une partie ou rejoignez-en une via un lien.</p>
                    <p id="connection-error" class="error-message hidden" role="alert"></p>
                    <div class="actions">
                        <button id="start-game-btn" class="btn-primary">Créer une partie</button>
                    </div>
                </div>
            </section>

            <!-- Waiting Screen -->
            <section id="waiting" class="screen hidden">
                <div class="glass-card">
                    <h2 id="waiting-status">En attente d'un adversaire...</h2>
                    
                    <div id="theme-selection" class="hidden">
                        <h3>Choisissez une thématique :</h3>
                        <div class="theme-buttons">
                            <!-- Theme buttons will be injected here -->
                        </div>
                    </div>

                    <div id="selected-theme-display" class="hidden">
                        Thématique : <span id="active-theme-name">...</span>
                    </div>

                    <div id="player-slots" class="player-slots-grid">
                        <!-- Up to 10 player slots injected here dynamically -->
                    </div>
                    <div class="actions" style="display:flex;gap:1rem;justify-content:center;">
                        <button id="ready-btn" class="btn-primary hidden">Je suis prêt !</button>
                        <button id="start-game-btn-host" class="btn-primary hidden">Lancer la partie</button>
                        <button id="solo-btn" class="btn-secondary hidden">Jouer en solo</button>
                    </div>
                </div>
            </section>

            <!-- Game Screen -->
            <section id="game" class="screen hidden">
                <div class="game-header">
                    <div class="timer-container">
                        <span id="timer">60</span>s
                    </div>
                    <div class="stats-bar">
                        <div id="leader-badge" class="badge">Égalité</div>
                        <div class="stat">WPM: <span id="current-wpm">0</span></div>
                        <div class="stat">Précision: <span id="current-accuracy">0</span>%</div>
                    </div>
                </div>

                <div id="countdown-overlay" class="hidden">
                    <span id="countdown-number">3</span>
                </div>

                <div class="text-display-container">
                    <div id="text-display" class="glass-card">
                        <div id="text-scroller">
                            <!-- Words will be injected here -->
                        </div>
                    </div>
                    <div class="progress-container">
                        <div id="racetrack-lanes" class="racetrack-lanes">
                            <!-- Horizontal dynamic racetracks for all active players -->
                        </div>
                    </div>
                </div>

                <div class="input-container">
                    <textarea id="typing-input" placeholder="Tapez ici..." spellcheck="false" disabled></textarea>
                </div>
            </section>

            <!-- Result Screen -->
            <section id="results" class="screen hidden">
                <div class="glass-card">
                    <h2 id="result-title">Résultats</h2>
                    
                    <!-- 3D styled podium for top 3 spots -->
                    <div id="podium-container" class="podium-container">
                        <!-- Injected dynamically -->
                    </div>

                    <!-- Scrollable table for other participants -->
                    <div id="standings-table-container" class="standings-table-container hidden">
                        <table class="standings-table">
                            <thead>
                                <tr>
                                    <th>Rang</th>
                                    <th>Joueur</th>
                                    <th>Score</th>
                                    <th>WPM</th>
                                    <th>Précision</th>
                                </tr>
                            </thead>
                            <tbody id="standings-tbody">
                                <!-- Ranks 4-10 dynamic elements -->
                            </tbody>
                        </table>
                    </div>

                    <button id="play-again-btn" class="btn-primary">Rejouer</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 TypeDash. Made with &hearts; for speed.</p>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
